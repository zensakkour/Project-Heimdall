name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint-style compile check
        run: |
          python -m py_compile src/tools/ui_server.py
          python -m py_compile src/tools/check_readme_links.py
          python -m compileall -q src

      - name: Unit tests
        run: python -m pytest -q

      - name: UI server import smoke test
        run: python -c "import src.tools.ui_server as _; print('ui_server import ok')"

      - name: README link check
        run: |
          python -m src.tools.check_readme_links README.md src/dashboard/README.md

