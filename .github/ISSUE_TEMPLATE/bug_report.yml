name: Bug Report
description: Report a reproducible defect in Project Heimdall.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide enough detail so we can reproduce it quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A short, clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run command ...
        2. Open page ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Tracebacks
      description: Paste terminal output, stack traces, or screenshots.
      render: shell
    validations:
      required: false

  - type: input
    id: commit
    attributes:
      label: Commit / Branch
      description: Git commit SHA or branch name tested.
      placeholder: master @ abc1234
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: 3.11.9
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
