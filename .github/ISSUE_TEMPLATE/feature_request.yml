name: Feature Request
description: Propose an enhancement for Project Heimdall.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the problem first, then the proposed solution. This helps us prioritize high-impact work.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: I am unable to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature behavior and expected outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternatives or workarounds you evaluated.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: What users or workflows benefit from this change?
    validations:
      required: false
