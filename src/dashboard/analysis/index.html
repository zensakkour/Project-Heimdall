<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heimdall Analysis</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="live.css?v=3" />
  </head>
  <body>
    <div class="layout">
      <header class="hero">
        <div class="hero-left">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="hero-text">
            <h1>Project Heimdall</h1>
            <p class="subtitle">Local test + score dashboard</p>
          </div>
        </div>
        <div class="hero-right">
          <div class="nav-tabs">
            <a href="../">Dashboard</a>
            <a class="active" href="./">Analysis</a>
          </div>
          <div class="actions">
            <button id="refresh">Refresh</button>
            <span id="last-updated" class="muted"></span>
          </div>
        </div>
      </header>

      <section class="card">
        <h2>Inputs</h2>
        <div class="inputs">
          <label>
            Image
            <input type="file" id="image-file" accept="image/*" />
          </label>
          <button id="analyze-image">Analyze Image</button>
        </div>

        <div class="inputs">
          <label>
            Video
            <input type="file" id="video-file" accept="video/*" />
          </label>
          <label>
            Snapshot interval (seconds)
            <input type="number" id="interval" value="2" min="1" step="1" />
          </label>
          <label>
            Max frames
            <input type="number" id="max-frames" value="12" min="1" step="1" />
          </label>
          <button id="analyze-video">Analyze Video</button>
        </div>
      </section>

      <section class="card">
        <h2>Result</h2>
        <div id="summary" class="summary">Waiting for analysis...</div>
        <div id="progress" class="progress" aria-live="polite">
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text" class="muted">Analyzing...</span>
        </div>
        <div class="geo-grid">
          <div>
            <div class="panel-head">
              <h3 class="panel-title">Fusion Globe</h3>
              <label class="legend-control muted">
                Show top
                <select id="live-topn">
                  <option value="2">2</option>
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20" selected>20</option>
                </select>
              </label>
            </div>
            <canvas id="live-map" class="globe-canvas" aria-label="Fusion globe"></canvas>
          </div>
          <div>
            <h3 class="panel-title">Track Globe</h3>
            <canvas id="live-track" class="globe-canvas small" aria-label="Track globe"></canvas>
          </div>
        </div>
        <div class="toolbar">
          <button id="zoom-in">Zoom In</button>
          <button id="zoom-out">Zoom Out</button>
          <button id="zoom-reset">Reset</button>
          <span class="muted">Scroll to zoom, drag to pan</span>
        </div>
        <div class="result-grid">
          <div class="preview">
            <canvas id="canvas" width="960" height="640"></canvas>
          </div>
          <div class="panel">
            <h3>Detections</h3>
            <div id="detection-list" class="list"></div>
            <h3>Details</h3>
            <pre id="details" class="details">Select a detection to inspect details.</pre>
            <h3>DOTA v1 Eval</h3>
            <div class="eval">
              <button id="run-eval">Run Eval</button>
              <div id="eval-status" class="muted">Status: idle</div>
              <pre id="eval-results" class="details">No results yet.</pre>
              <div id="eval-metrics" class="metrics"></div>
              <div id="eval-classes" class="class-table"></div>
            </div>
          </div>
        </div>
        <div id="frames" class="frames"></div>
      </section>
    </div>

    <script src="live.js?v=3"></script>
  </body>
</html>
