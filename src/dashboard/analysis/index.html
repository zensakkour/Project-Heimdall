<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heimdall Operator</title>
    <link rel="icon" type="image/png" href="../assets/logo-mark.png?v=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="../theme.css?v=7" />
    <link rel="stylesheet" href="operator.css?v=7" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Background Map (ALWAYS VISIBLE) -->
      <div id="live-map" class="map-bg"></div>

      <!-- Top Header Area -->
      <header class="operator-header">
        <div class="brand">
          <img src="../assets/logo-mark.png" alt="Heimdall" />
          <span class="brand-text">Paris — Project Heimdall</span>
        </div>
      </header>

      <!-- Right Analysis Panel -->
      <main class="analysis-panel">
        <!-- Ingest Section -->
        <section class="panel-section ingest-section">
          <div class="section-title">Image Geolocation Input</div>
          <div class="ingest-controls">
            <div id="ingest-block" class="sci-fi-ingest">
              <input type="file" id="image-file" accept="image/*" style="display: none;" />
              <div id="ingest-trigger" class="ingest-trigger">
                <div id="ingest-preview-wrap" class="ingest-preview-wrap" style="display: none;">
                  <img id="ingest-preview" src="" alt="Preview" />
                </div>
                <div id="ingest-prompt">
                  <span class="ingest-icon">📤</span>
                  <span class="ingest-label">Select source image</span>
                  <span id="ingest-filename" class="ingest-filename">No file selected</span>
                </div>
              </div>
            </div>
            <div class="profile-row">
              <select id="profile-select">
                <option value="paris">Paris (Standard)</option>
                <option value="paris_test">Paris (Test)</option>
              </select>
              <button id="geolocate-image" class="primary-btn">Geolocate Image</button>
            </div>
          </div>
        </section>

        <!-- Progress Overlay (Functional) -->
        <div id="progress" class="progress-wrap" style="display: none;">
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
          <div id="progress-text" class="progress-label">Geolocating...</div>
        </div>

        <!-- Result Status Section -->
        <section id="result-status" class="panel-section status-section" style="display: none;">
          <div class="status-metrics">
            <div class="metric-mini">
              <label>Location</label>
              <span id="metric-location">-</span>
            </div>
            <div class="metric-mini">
              <label>Confidence</label>
              <span id="metric-confidence">-</span>
            </div>
          </div>
        </section>

        <!-- Candidate List -->
        <section class="panel-section list-section">
          <div class="section-head-row">
            <div class="section-title">Localized Candidates</div>
            <div class="count-selector">
              <label>Show top:</label>
              <div class="toggle-group" id="top-n-toggle">
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3" class="active">3</button>
                <button data-value="5">5</button>
                <button data-value="10">10</button>
              </div>
            </div>
          </div>
          <div id="results-list" class="results-scroll">
            <div class="empty-state">Upload imagery to begin.</div>
          </div>
        </section>

        <!-- Diagnostics (Hidden/Collapsible) -->
        <footer class="panel-footer">
          <div id="diag-trigger" class="diag-toggle">
            System Diagnostics <span>▾</span>
          </div>
          <div id="diag-accordion" class="diag-body">
             <div class="diag-grid">
               <span>Backend:</span> <strong id="diag-backend">-</strong>
               <span>Worker:</span> <strong id="diag-worker">-</strong>
               <span>Tier:</span> <strong id="diag-tier">-</strong>
               <span>Radius:</span> <strong id="diag-radius">-</strong>
             </div>
             <pre id="raw-json" class="raw-json">{}</pre>
          </div>
        </footer>
      </main>
    </div>

    <!-- Hidden elements for legacy script compatibility -->
    <div style="display: none;">
        <div id="summary"></div>
        <div id="metric-tier"></div>
        <div id="metric-mode"></div>
        <select id="live-topn"><option value="20">20</option></select>
        <div id="geo-ranking"></div>
        <div id="detection-list"></div>
        <pre id="details"></pre>
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js" crossorigin=""></script>
    <script type="module" src="operator.js?v=7"></script>
  </body>
</html>
