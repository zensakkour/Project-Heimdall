<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heimdall Analysis</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="live.css?v=7" />
  </head>
  <body>
    <div class="layout">
      <section class="card">
        <div class="section-head">
          <div class="section-title">
            <div class="brand-mark" aria-hidden="true">
              <img class="brand-logo" src="../assets/logo.svg" alt="Heimdall logo" />
            </div>
            <div>
              <h2>Inputs</h2>
              <p class="muted">Upload an image for analysis.</p>
            </div>
          </div>
          <div class="actions">
            <button id="refresh">Refresh</button>
            <span id="last-updated" class="muted"></span>
          </div>
        </div>
        <div class="inputs inputs-row">
          <div class="file-input">
            <div class="file-label">Image</div>
            <label class="file-picker">
              <input type="file" id="image-file" accept="image/*" />
              <span class="file-button">Choose file</span>
              <span class="file-name" id="image-file-name">No file selected</span>
            </label>
          </div>
          <button id="analyze-image">Analyze Image</button>
        </div>
      </section>

      <section class="card">
        <h2>Live Analysis</h2>
        <div id="summary" class="summary">Waiting for analysis...</div>
        <div id="progress" class="progress" aria-live="polite">
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text" class="muted">Analyzing...</span>
        </div>
        <div class="geo-grid">
          <div>
            <div class="panel-head">
              <h3 class="panel-title">Fusion Map</h3>
              <label class="legend-control muted">
                Show top
                <select id="live-topn">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20" selected>20</option>
                </select>
              </label>
            </div>
            <div id="live-map" class="globe-canvas" aria-label="Fusion map"></div>
            <div class="map-legend muted">
              <span class="legend-dot candidate"></span> Candidate (size = confidence)
              <span class="legend-dot mean"></span> Fused mean
              <span class="legend-dot ring"></span> Uncertainty radius
              <span class="legend-sep"></span>
              <span id="live-topn-label">Showing top 20 candidates on map</span>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <button id="zoom-in">Zoom In</button>
          <button id="zoom-out">Zoom Out</button>
          <button id="zoom-reset">Reset</button>
          <span class="muted">Scroll to zoom, drag to pan</span>
        </div>
        <div class="result-grid">
          <div class="preview">
            <canvas id="canvas" width="960" height="640"></canvas>
          </div>
          <div class="panel">
            <h3>Detections</h3>
            <div id="detection-list" class="list"></div>
            <h3>Details</h3>
            <pre id="details" class="details">Select a detection to inspect details.</pre>
          </div>
        </div>
      </section>

    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="live.js?v=8"></script>
  </body>
</html>
