<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Heimdall eye over globe">
  <defs>
    <linearGradient id="orb" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#78f6d7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b111a" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#78f6d7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78f6d7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0b111a" stroke="rgba(120,246,215,0.35)" stroke-width="2"/>
  <circle cx="60" cy="60" r="42" fill="url(#glow)" opacity="0.35"/>

  <!-- Globe -->
  <circle cx="60" cy="70" r="28" fill="url(#orb)" opacity="0.95"/>
  <ellipse cx="60" cy="70" rx="28" ry="9" fill="none" stroke="rgba(6,12,14,0.35)" stroke-width="1.4"/>
  <ellipse cx="60" cy="70" rx="18" ry="28" fill="none" stroke="rgba(6,12,14,0.35)" stroke-width="1.4"/>
  <ellipse cx="60" cy="70" rx="8" ry="28" fill="none" stroke="rgba(6,12,14,0.28)" stroke-width="1.1"/>

</svg>
